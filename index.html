<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>番茄钟</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="tabs">
        <button class="tab active" data-mode="work">专注</button>
        <button class="tab" data-mode="shortBreak">短休息</button>
        <button class="tab" data-mode="longBreak">长休息</button>
      </div>
    </header>

    <main>
      <div class="timer-ring-container">
        <svg class="timer-ring" viewBox="0 0 200 200">
          <circle class="ring-bg" cx="100" cy="100" r="88" />
          <circle class="ring-progress" cx="100" cy="100" r="88" />
        </svg>
        <div class="timer-display">
          <div class="timer-time" id="timerTime">25:00</div>
          <div class="timer-label" id="timerLabel">专注时间</div>
        </div>
      </div>

      <div class="controls">
        <button class="btn btn-secondary" id="resetBtn" title="重置">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="1 4 1 10 7 10"></polyline>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
          </svg>
        </button>
        <button class="btn btn-primary" id="startBtn">
          <span id="startBtnText">开始</span>
        </button>
        <button class="btn btn-secondary" id="skipBtn" title="跳过">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="5 4 15 12 5 20 5 4"></polygon>
            <line x1="19" y1="5" x2="19" y2="19"></line>
          </svg>
        </button>
      </div>

      <div class="sessions">
        <span class="session-label">已完成：</span>
        <div class="session-dots" id="sessionDots">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
        <span class="session-count" id="sessionCount">0 / 4</span>
      </div>
    </main>

    <footer>
      <button class="settings-btn" id="settingsBtn" title="设置">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </footer>

    <!-- 设置弹窗 -->
    <div class="modal-overlay" id="settingsModal">
      <div class="modal">
        <div class="modal-header">
          <h2>设置</h2>
          <button class="modal-close" id="modalClose">&times;</button>
        </div>
        <div class="modal-body">
          <div class="setting-item">
            <label>专注时长（分钟）</label>
            <input type="number" id="workDuration" min="1" max="120" value="25">
          </div>
          <div class="setting-item">
            <label>短休息时长（分钟）</label>
            <input type="number" id="shortBreakDuration" min="1" max="30" value="5">
          </div>
          <div class="setting-item">
            <label>长休息时长（分钟）</label>
            <input type="number" id="longBreakDuration" min="1" max="60" value="15">
          </div>
          <div class="setting-item">
            <label>长休息间隔（番茄数）</label>
            <input type="number" id="sessionsBeforeLong" min="1" max="10" value="4">
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="cancelSettings">取消</button>
          <button class="btn btn-primary" id="saveSettings">保存</button>
        </div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
